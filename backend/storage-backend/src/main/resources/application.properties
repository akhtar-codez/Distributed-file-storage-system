spring.application.name=storage-backend

storage.base-path=../../storage/
storage.chunk-size=8192
spring.datasource.url=jdbc:mysql://localhost:3306/dfs_db
spring.datasource.username=root
spring.datasource.password=Root@2319932
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Secret key for JWT token signing — must be at least 32 characters
jwt.secret=dfss-secret-key-must-be-at-least-32-characters-long

# JWT token validity in milliseconds — 86400000 = 24 hours
jwt.expiration=86400000

# Maximum file size allowed for upload — 100MB
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Allowed file types for upload (comma separated)
storage.allowed-extensions=txt,pdf,png,jpg,jpeg,docx,xlsx,mp4,zip